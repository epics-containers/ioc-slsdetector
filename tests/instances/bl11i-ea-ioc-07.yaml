# yaml-language-server: $schema=https://github.com/epics-containers/ioc-slsdetector/releases/latest/download/ibek.ioc.schema.json

# Converted from the builder XML /dls_sw/work/R3.14.12.7/support/BL11I-BUILDER/etc/makeIocs/BL11I-EA-IOC-07.xml
# with builder2ibek bb7ba9e xml2yaml.
# Changed, so that nobody running this test reaches a real device:
# - 0 device addresses replaced with 127.0.0.1: the one IP in the XML, the
#   autosave ip attribute, is not carried into ibek; no secrets
# - the value Yes quoted, so that YAML 1.1 tools read it as a string, as
#   ibek does
# tests/run-tests.sh runs it with start.sh --test, which generates the
# runtime assets but does not launch the IOC.

ioc_name: "{{ _global.get_env('IOC_NAME') }}"

description: auto-generated by https://github.com/epics-containers/builder2ibek

entities:

  - type: epics.EpicsEnvSet
    name: EPICS_TZ
    value: GMT0BST

  - type: epics.EpicsEnvSet
    name: STREAM_PROTOCOL_PATH
    value: /epics/runtime/protocol/

  - type: devIocStats.iocAdminSoft
    IOC: '{{ ioc_name | upper }}'

  - type: epics.PreBootCommandSet
    command: export SLSDETNAME="$USER"

  - type: autosave.Autosave
    P: 'BL11I-EA-IOC-07:'

  - type: pvlogging.PvLogging
    access_file: /epics/support/pvlogging/src/access.acf

  - type: epics.EpicsCaMaxArrayBytes
    max_bytes: 800000

  - type: epics.EpicsCaMaxArrayBytes
    max_bytes: 800000

  - type: slsDetector.slsDetectorConfigure
    BUFFERS: 50
    MEMORY: 0
    P: BL11I-EA-DET-07
    PORT: MYTHEN3.DET
    R: ':DET:'
    TIMEOUT: 10
    configFile: /dls_sw/i11/software/mythen/mythen3.config
    detectorIndex: 0
    numModules: 28

  - type: ADCore.NDStdArrays
    FTVL: FLOAT
    NDARRAY_PORT: MYTHEN3.DET
    NELEMENTS: 23040
    P: BL11I-EA-DET-07
    PORT: MYTHEN3.ARR
    R: ':ARR:'
    TYPE: Float32

  - type: ADCore.NDFileHDF5
    NDARRAY_PORT: MYTHEN3.DET
    P: BL11I-EA-DET-07
    PORT: MYTHEN3.HDF
    QUEUE: 16
    R: ':HDF:'

  - type: epics.dbpf
    pv: BL11I-EA-DET-07:DET:DataType
    value: UInt32

  - type: epics.dbpf
    pv: BL11I-EA-DET-07:HDF:EnableCallbacks
    value: Enable

  - type: epics.dbpf
    pv: BL11I-EA-DET-07:ARR:EnableCallbacks
    value: Enable

  - type: epics.dbpf
    pv: BL11I-EA-DET-07:HDF:LazyOpen
    value: 'Yes'

  - type: epics.dbpf
    pv: BL11I-EA-DET-07:DET:HighVoltage
    value: '200'

  - type: epics.dbpf
    pv: BL11I-EA-DET-07:DET:BitDepth
    value: '32'

  - type: epics.dbpf
    pv: BL11I-EA-DET-07:DET:Thr1Only
    value: Adjust counter 1 only

  - type: epics.dbpf
    pv: BL11I-EA-DET-07:DET:Counter1Threshold
    value: '7500'

  - type: epics.dbpf
    pv: BL11I-EA-DET-07:DET:Counter2Threshold
    value: '20000'

  - type: epics.dbpf
    pv: BL11I-EA-DET-07:DET:Counter3Threshold
    value: '20000'
